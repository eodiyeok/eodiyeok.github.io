name: Update station data

on:
  schedule:
    - cron: '15 21 * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: update-station-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Update from official source
        run: npm run data:update
        env:
          KRIC_SERVICE_KEY: ${{ secrets.KRIC_SERVICE_KEY }}
      - name: Check whether data changed
        id: changes
        run: |
          if git diff --quiet -- src/lib/data/stations.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Verify updated data
        if: steps.changes.outputs.changed == 'true'
        run: |
          npm run check
          npm test
      - name: Commit updated data
        if: steps.changes.outputs.changed == 'true'
        run: |
          source_date=$(node -p "require('./src/lib/data/stations.json').meta.sourceDate")
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/data/stations.json
          git commit -m "chore: update station data to $source_date"
          git push
      - name: Deploy updated site
        if: steps.changes.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy.yml
