name: Update station data

on:
  schedule:
    - cron: '15 21 * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Check official source date
        id: source
        run: npm run data:check
      - name: Open update notice
        if: steps.source.outputs.needs_update == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_DATE: ${{ steps.source.outputs.source_date }}
        run: |
          title="역 데이터 갱신 필요: $SOURCE_DATE"
          count=$(gh issue list --state open --search "$title in:title" --json number --jq length)
          if [ "$count" -eq 0 ]; then
            gh issue create \
              --title "$title" \
              --body "국토교통부 도시철도 전체노선 자료가 갱신됐습니다. WSL 프로젝트에서 npm run data:update를 실행하고 변경 내용을 푸시하세요."
          fi
